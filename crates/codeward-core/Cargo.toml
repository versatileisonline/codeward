[package]
name = "codeward-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }
# Enable cleanup support in HKDF/AEAD's existing transitive dependencies.
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
poly1305 = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
