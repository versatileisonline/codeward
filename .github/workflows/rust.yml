name: Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report the repository-pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_HOME: ${{ runner.temp }}/codeward-cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report the repository-pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          git rev-parse HEAD
      # Cache registry metadata/archives only, never credentials, vaults or builds.
      - name: Cache locked registry dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
          key: registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Test workspace including doctests
        run: cargo test --workspace --locked --offline
      - name: Check all targets with Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings

  gate:
    name: Rust CI
    if: ${{ always() }}
    needs: [format, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FORMAT_RESULT: ${{ needs.format.result }}
      CHECK_RESULT: ${{ needs.check.result }}
    steps:
      - name: Require every validation job to succeed
        run: |
          test "$FORMAT_RESULT" = success
          test "$CHECK_RESULT" = success
