name: Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and report the repository-pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Isolate Cargo registry from checkout and credentials
        run: echo "CARGO_HOME=$RUNNER_TEMP/codeward-cargo" >> "$GITHUB_ENV"
      - name: Install and report the repository-pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version
          git rev-parse HEAD
      # Cache registry metadata/archives only, never credentials, vaults or builds.
      - name: Cache locked registry dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
          key: registry-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check default builds without experimental features
        run: cargo check --workspace --no-default-features --locked --offline
      - name: Test native Windows storage before the core suite
        if: runner.os == 'Windows'
        run: cargo test -p codeward-storage-windows --all-features --locked --offline
      - name: Probe synthetic NTFS flush capabilities under a restricted token
        if: runner.os == 'Windows'
        run: cargo test -p codeward-storage-windows --all-features --locked --offline -- tests::flush_probe::ntfs_flush_capability_probe --ignored --exact --nocapture
      - name: Test workspace including experimental features and doctests
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cargo test --workspace --exclude codeward-storage-windows --all-features --locked --offline
          else
            cargo test --workspace --all-features --locked --offline
          fi
      - name: Test synthetic Linux storage on ext4
        if: runner.os == 'Linux'
        run: |
          umask 077
          image=$(mktemp "$RUNNER_TEMP/codeward-ext4.XXXXXX")
          fixture=$(sudo mktemp -d /mnt/codeward-ext4.XXXXXX)
          trap 'if mountpoint -q "$fixture"; then sudo umount "$fixture"; fi; sudo rmdir "$fixture"; rm -f "$image"' EXIT
          truncate -s 64M "$image"
          mkfs.ext4 -q -F "$image"
          sudo mount -o loop,nodev,nosuid,noexec "$image" "$fixture"
          sudo chown "$(id -u):$(id -g)" "$fixture"
          sudo chmod 0700 "$fixture"
          findmnt --target "$fixture" --output FSTYPE,OPTIONS
          # An unrelated test's fork can retain the companion lock until exec.
          CODEWARD_LINUX_EXT4_FIXTURE="$fixture" cargo test -p codeward-storage-linux --locked --offline -- ext4_ --ignored --test-threads=1
          CODEWARD_LINUX_EXT4_FIXTURE="$fixture" CODEWARD_LINUX_PRIVILEGED_MOUNT_TEST=1 cargo test -p codeward-storage-linux --locked --offline -- tests::admission::privileged_managed_submount_refuses_preparation_reads_and_publication --exact --ignored --test-threads=1
      - name: Test synthetic desktop redaction
        if: runner.os == 'macOS'
        run: node --test crates/codeward-host-macos/tests/desktop-redaction.cjs
      - name: Verify synthetic recovery with macOS networking denied
        if: runner.os == 'macOS'
        run: |
          recovery_filter=staging::transactions::tests::recovery::
          recovery_probe="${recovery_filter}offline_network_denial_probe"
          recovery_listing=$(cargo test -p codeward-storage-macos --all-features --locked --offline "$recovery_filter" -- --list)
          recovery_probe_listing=$(cargo test -p codeward-storage-macos --all-features --locked --offline "$recovery_probe" -- --ignored --exact --list)
          python3 - "$recovery_listing" "$recovery_probe_listing" "$recovery_probe" <<'PY'
          import sys
          def tests(listing):
              return {
                  line.removesuffix(": test") for line in listing.splitlines()
                  if line.startswith("staging::transactions::tests::recovery::")
                  and line.endswith(": test")
              }
          if len(tests(sys.argv[1])) != 6:
              raise SystemExit("expected five recovery scenarios and the network-denial probe")
          if tests(sys.argv[2]) != {sys.argv[3]}:
              raise SystemExit("expected the exact ignored network-denial probe")
          PY
          recovery_sandbox_profile='(version 1) (allow default) (deny network*)'
          sandbox-exec -p "$recovery_sandbox_profile" cargo test -p codeward-storage-macos --all-features --locked --offline "$recovery_probe" -- --ignored --exact
          sandbox-exec -p "$recovery_sandbox_profile" cargo test -p codeward-storage-macos --all-features --locked --offline "$recovery_filter" -- --test-threads=1
      - name: Check all targets with Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings

  gate:
    name: Rust CI
    if: ${{ always() }}
    needs: [format, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FORMAT_RESULT: ${{ needs.format.result }}
      CHECK_RESULT: ${{ needs.check.result }}
    steps:
      - name: Require every validation job to succeed
        run: |
          test "$FORMAT_RESULT" = success
          test "$CHECK_RESULT" = success
